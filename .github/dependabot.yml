# Dependency updates, kept quiet on purpose: one grouped pull request a month for the packages
# and one for the GitHub Actions used by the workflows. Security fixes are not delayed by this
# schedule; GitHub opens those as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch releases arrive together. A major release gets its own pull request,
      # because it can need code changes.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
